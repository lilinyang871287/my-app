<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Moss & Stone</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@300;400;700&family=Inter:wght@300;400;600&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              concrete: '#E0E0E0',
              'concrete-dark': '#C0C0C0',
              moss: '#4A5D23',
              'moss-light': '#6B823A',
              ink: '#2C2C2C',
            },
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              serif: ['"Noto Serif SC"', 'serif'],
            },
            animation: {
              'grow-moss': 'grow 4s ease-in-out forwards',
              'carve-text': 'carve 1.5s ease-out forwards',
            },
            keyframes: {
              grow: {
                '0%': { transform: 'scale(0)', opacity: '0' },
                '100%': { transform: 'scale(1)', opacity: '1' },
              },
              carve: {
                '0%': { 
                  textShadow: '0px 0px 0px rgba(255,255,255,0)',
                  color: '#3a3a3a',
                  transform: 'scale(1)'
                },
                '50%': {
                  transform: 'scale(0.99)'
                },
                '100%': { 
                  textShadow: '1px 1px 0px rgba(255,255,255,0.5), inset 2px 2px 4px rgba(0,0,0,0.6)',
                  color: 'rgba(30,30,30,0.7)',
                  transform: 'scale(1)'
                },
              }
            }
          },
        },
      }
    </script>
    <style>
      body {
        background-color: #E0E0E0;
        color: #2C2C2C;
        overflow-x: hidden;
      }
      /* Noise texture overlay */
      .noise-bg {
        position: fixed;
        top: 0;
        left: 0;
        width: 100vw;
        height: 100vh;
        pointer-events: none;
        z-index: 50;
        opacity: 0.05;
        background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.65' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)'/%3E%3C/svg%3E");
      }
      .engraved-text {
        text-shadow: 1px 1px 0px rgba(255,255,255,0.7);
        color: #3a3a3a;
      }
      .carved-deep {
        text-shadow: -1px -1px 1px rgba(255,255,255,0.2), 1px 1px 2px rgba(0,0,0,0.8) !important;
        color: rgba(44, 44, 44, 0.8) !important;
        transition: all 1s ease-out;
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.554.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "@google/genai": "https://aistudiocdn.com/@google/genai@^1.30.0"
  }
}
</script>
<link rel="stylesheet" href="/index.css">
</head>
  <body>
    <div id="root"></div>
    <div class="noise-bg"></div>
  <script type="module" src="/index.tsx"></script>
</body>
</html>
